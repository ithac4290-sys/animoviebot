<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AniMovie WebApps Portal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0b0e14;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #151a23;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #ff334b, #ff7b00);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
      box-shadow: 0 6px 20px rgba(255,51,75,0.4);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .app-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e2532;
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s;
    }
    .app-btn:active {
      transform: scale(0.97);
    }
    .app-btn.manga {
      background: linear-gradient(135deg, #0284c7, #0369a1);
    }
    .app-btn.shorts {
      background: linear-gradient(135deg, #ff334b, #dc2626);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎬</div>
    <h1>AniMovie Mini Apps</h1>
    <p>Telegram bot uchun maxsus yaratilgan interaktiv ilovalar</p>
    <div class="btn-group">
      <a href="manga/index.html" class="app-btn manga">📖 Manga mutolaa qilish</a>
      <a href="shorts/index.html" class="app-btn shorts">⚡️ Shorts videolarni ko'rish</a>
    </div>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
  </script>
</body>
</html>
